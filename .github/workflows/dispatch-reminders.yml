name: Dispatch reminders

# Manual trigger only. This is NOT the scheduler.
#
# The Vercel cron in vercel.json calls /api/cron/dispatch-reminders every minute and is what makes
# a reminder arrive near its time. This workflow is kept for firing a sweep by hand — after an
# incident, or to confirm the endpoint still answers.
#
# It used to hold the schedule, on a five-minute cron. GitHub delivered roughly one run an hour
# against it, so reminders arrived up to an hour after the time printed on them. GitHub's
# scheduler is best-effort, is deprioritised under load, and disables scheduled workflows after
# 60 days without repository activity — none of which is acceptable for clinical reminders. The
# schedule was removed rather than lengthened: a cadence GitHub will not honour is worse than no
# cadence, because the green ticks make it look like it is working.
#
# The cadence then sat on cron-job.org for a while, which failed the same way for a different
# reason: CRON_SECRET was overwritten with an unrelated key, cron-job.org auto-disabled the job
# after eight days of 401s, and nothing said so. A scheduler outside the deployment fails quietly
# whichever vendor holds it, which is why the schedule now ships in vercel.json.
#
# Setup: add two repository secrets under Settings → Secrets and variables → Actions
#   APP_URL      the canonical host, no trailing slash — the one that answers *without* a
#                redirect. An apex domain that 308s to www cannot work: curl drops the
#                Authorization header across a host change, so the request arrives unauthenticated
#                whether or not the redirect is followed. Check with:
#                  curl -o /dev/null -w '%{http_code}\n' https://YOUR-HOST/api/health
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on Vercel
#
# Both secrets exist only to run this by hand. Deleting them disables that and nothing else — the
# Vercel cron authorises itself from the project's own CRON_SECRET.

on:
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # curl already caps the request at 60s; this caps everything around it. Without a job timeout
    # GitHub's default is six hours, so a runner that wedges before the step ever runs holds a
    # slot and reports a failure whose duration says nothing about the sweep itself.
    timeout-minutes: 5
    steps:
      - name: Trigger reminder sweep
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "APP_URL or CRON_SECRET is not set — add both as repository secrets."
            exit 1
          fi

          # Body and status are captured separately so a failure prints the reason.
          response=$(curl -sS --max-time 60 -w '\n%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/dispatch-reminders")

          status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')

          echo "status: ${status}"
          echo "body:   ${body}"

          # A redirect is the failure mode that cost the most time to find, so it is named rather
          # than left as a bare status. `APP_URL` must be the host Vercel actually serves — the
          # apex 308s to www, and curl drops the Authorization header across a host change, so
          # neither following the redirect nor ignoring it can ever reach the endpoint.
          case "$status" in
            30*)
              echo "APP_URL redirects (${status}). Set it to the canonical host — the one that"
              echo "answers without a redirect, e.g. https://www.example.com and not the apex."
              exit 1
              ;;
            401)
              echo "Rejected as unauthorised. The CRON_SECRET repository secret does not match the"
              echo "CRON_SECRET environment variable on the deployment APP_URL points at."
              exit 1
              ;;
          esac

          if [ "$status" != "200" ]; then
            echo "Reminder sweep failed."
            exit 1
          fi

          echo "Sweep completed."
